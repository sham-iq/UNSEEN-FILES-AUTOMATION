name: Unseen Files Daily Publisher

on:
  schedule:
    # 20:00 Sri Lanka time (UTC+05:30) = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unseen-files-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Facebook credentials
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FB_PAGE_ACCESS_TOKEN}" ]; then
            echo "::error::Add FB_PAGE_ACCESS_TOKEN under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pillow edge-tts

      - name: Generate today's video and narration
        run: |
          set -euo pipefail
          python scripts/create_daily_video.py
          edge-tts --voice en-US-GuyNeural --rate="+3%" --text "$(cat output/narration.txt)" --write-media output/narration.mp3
          # Make a 60-second vertical video from the six generated cinematic scene cards.
          # Each scene is displayed for ten seconds, with narration and a low-volume ambience-free mix.
          ffmpeg -y \
            -loop 1 -t 10 -i output/scene1.png \
            -loop 1 -t 10 -i output/scene2.png \
            -loop 1 -t 10 -i output/scene3.png \
            -loop 1 -t 10 -i output/scene4.png \
            -loop 1 -t 10 -i output/scene5.png \
            -loop 1 -t 10 -i output/scene6.png \
            -i output/narration.mp3 \
            -filter_complex "[0:v]scale=720:1280,setsar=1[v0];[1:v]scale=720:1280,setsar=1[v1];[2:v]scale=720:1280,setsar=1[v2];[3:v]scale=720:1280,setsar=1[v3];[4:v]scale=720:1280,setsar=1[v4];[5:v]scale=720:1280,setsar=1[v5];[v0][v1][v2][v3][v4][v5]concat=n=6:v=1:a=0,format=yuv420p[v]" \
            -map "[v]" -map 6:a -t 60 -r 24 -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 128k -shortest output/unseen-files-daily.mp4
          test -s output/unseen-files-daily.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/unseen-files-daily.mp4

      - name: Publish generated video to Facebook Page
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1360132067172555' }}
        run: |
          set -euo pipefail
          CAPTION="$(cat output/caption.txt)"
          RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
            "https://graph.facebook.com/v23.0/${FB_PAGE_ID}/videos" \
            --form "source=@output/unseen-files-daily.mp4;type=video/mp4" \
            --form-string "description=${CAPTION}" \
            --form-string "access_token=${FB_PAGE_ACCESS_TOKEN}")"
          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Facebook video ID:", d.get("id", "no ID returned")); sys.exit(0 if d.get("id") else 1)'

      - name: Save generated video as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unseen-files-generated-video
          path: output/
          if-no-files-found: warn
          retention-days: 3
