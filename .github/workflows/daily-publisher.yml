name: Unseen Files Daily Publisher

on:
  schedule:
    # 20:00 Sri Lanka time (UTC+05:30) = 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unseen-files-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1360132067172555' }}
          VIDEO_URL: ${{ vars.VIDEO_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FB_PAGE_ACCESS_TOKEN}" ]; then
            echo "::error::Add FB_PAGE_ACCESS_TOKEN under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi
          if [ -z "${FB_PAGE_ID}" ]; then
            echo "::error::Set the FB_PAGE_ID repository variable."
            exit 1
          fi
          if [ -z "${VIDEO_URL}" ]; then
            echo "::notice::VIDEO_URL is empty. Create today's video in Flow, host the MP4 at a direct HTTPS URL, and set VIDEO_URL. Nothing was posted."
            exit 0
          fi
          case "${VIDEO_URL}" in
            https://*.mp4|https://*\.mp4\?*) ;;
            *)
              echo "::error::VIDEO_URL is not a direct MP4 file URL. A Facebook share/reel page URL cannot be used as file_url. Set VIDEO_URL to a publicly accessible HTTPS URL that downloads the actual .mp4 video."
              exit 1
              ;;
          esac

      - name: Publish video to Facebook Page
        id: publish
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID || '1360132067172555' }}
          VIDEO_URL: ${{ vars.VIDEO_URL }}
          VIDEO_DESCRIPTION: ${{ vars.VIDEO_DESCRIPTION }}
        run: |
          set -euo pipefail
          if [ -z "${VIDEO_URL:-}" ]; then
            echo "No VIDEO_URL configured; safely skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p state
          LAST_URL=""
          if [ -f state/last_video_url.txt ]; then
            LAST_URL="$(cat state/last_video_url.txt)"
          fi
          if [ "${VIDEO_URL}" = "${LAST_URL}" ]; then
            echo "::notice::This video URL was already published. Skipping to prevent duplicate posts."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CAPTION="${VIDEO_DESCRIPTION:-Unseen Files — disturbing truths, hidden mysteries, and stories that stay with you. Follow for more.}"
          RESPONSE="$(curl --fail-with-body --silent --show-error --request POST \
            "https://graph.facebook.com/v23.0/${FB_PAGE_ID}/videos" \
            --form-string "file_url=${VIDEO_URL}" \
            --form-string "description=${CAPTION}" \
            --form-string "access_token=${FB_PAGE_ACCESS_TOKEN}")"

          echo "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); print("Facebook video ID:", d.get("id", "no ID returned")); sys.exit(0 if d.get("id") else 1)'
          printf '%s' "${VIDEO_URL}" > state/last_video_url.txt
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Save duplicate-prevention state
        if: success() && steps.publish.outputs.skipped != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/last_video_url.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record published Unseen Files video"
            git push
          fi
